org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# BroBehave project settings (not secrets)
# GitHub repository whose Releases page the `github` flavor checks for updates.
brobehave.githubRepo=AshfaqueO/BroBehave
# Public web pages (GitHub Pages, served from /docs): privacy, terms, account deletion, invites.
brobehave.webBaseUrl=https://ashfaqueo.github.io/BroBehave
