name: Release

# On a v* tag: a signed `github` APK with its SHA-256 and a changelog becomes a GitHub
# Release, and a signed `play` App Bundle is kept as a build artifact for manual upload to
# the Play Console.
#
# Repository secrets (Settings -> Secrets and variables -> Actions). None are in the repo.
#   GITHUB_KEYSTORE_BASE64, GITHUB_KEYSTORE_PASSWORD, GITHUB_KEY_ALIAS, GITHUB_KEY_PASSWORD
#       the key that signs APKs published on GitHub (keep it forever: updates need the same key)
#   PLAY_KEYSTORE_BASE64, PLAY_KEYSTORE_PASSWORD, PLAY_KEY_ALIAS, PLAY_KEY_PASSWORD
#       the Play *upload* key (Google re-signs with the Play App Signing key)
#   SUPABASE_URL, SUPABASE_ANON_KEY          production project (the anon key is public by design)
#   GOOGLE_WEB_CLIENT_ID                     OAuth web client id for Google Sign-In
#   GOOGLE_SERVICES_JSON_BASE64              app/google-services.json (FCM + Crashlytics)
#   BLOCKLIST_PUBLIC_KEY                     optional: enables signed blocklist updates
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
  BLOCKLIST_PUBLIC_KEY: ${{ secrets.BLOCKLIST_PUBLIC_KEY }}

jobs:
  verify:
    name: Tests before release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck detekt test

  github-apk:
    name: Signed APK -> GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, for the changelog

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key and Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.GITHUB_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Build signed APK
        env:
          BROBEHAVE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          BROBEHAVE_KEYSTORE_PASSWORD: ${{ secrets.GITHUB_KEYSTORE_PASSWORD }}
          BROBEHAVE_KEY_ALIAS: ${{ secrets.GITHUB_KEY_ALIAS }}
          BROBEHAVE_KEY_PASSWORD: ${{ secrets.GITHUB_KEY_PASSWORD }}
        run: ./gradlew assembleGithubRelease

      # The in-app update check reads the version code from this file name.
      - name: Name the APK, write its checksum and the changelog
        id: package
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/github/release/*.apk | head -1)
          case "$apk" in *unsigned*) echo "The APK is unsigned: signing secrets are missing." >&2; exit 1;; esac
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          badging=$("$aapt" dump badging "$apk")
          version_name=$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          version_code=$(echo "$badging" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)
          mkdir -p dist
          out="dist/BroBehave-${version_name}-${version_code}.apk"
          cp "$apk" "$out"
          (cd dist && sha256sum "$(basename "$out")" > "$(basename "$out").sha256")

          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## BroBehave ${version_name}"
            echo
            if [ -n "$previous" ]; then
              echo "Changes since ${previous}:"
              git log --no-merges --pretty='- %s' "${previous}..${GITHUB_REF_NAME}"
            else
              echo "First release."
            fi
            echo
            echo "### Verify your download"
            echo '```'
            cat "${out}.sha256"
            echo '```'
            echo "Compare with \`sha256sum BroBehave-${version_name}-${version_code}.apk\` (Linux/macOS) or \`Get-FileHash\` (Windows)."
          } > dist/CHANGELOG.md
          echo "apk=$out" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.apk }}" "${{ steps.package.outputs.apk }}.sha256" \
            --title "BroBehave $GITHUB_REF_NAME" --notes-file dist/CHANGELOG.md

  play-bundle:
    name: Signed App Bundle for Play (artifact)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload key and Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Build signed App Bundle
        env:
          BROBEHAVE_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          BROBEHAVE_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          BROBEHAVE_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          BROBEHAVE_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: ./gradlew bundlePlayRelease

      - uses: actions/upload-artifact@v4
        with:
          name: play-app-bundle
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
          retention-days: 30
