name: Pages

# Publishes the public web pages in /site (privacy policy, terms, account deletion, invite
# landing page) to GitHub Pages. In the repository settings choose Pages -> Source: GitHub Actions.
# Note: Pages for a PRIVATE repository needs a paid GitHub plan; the pages themselves are public.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
